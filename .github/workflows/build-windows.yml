name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/build-windows.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-windows:
    name: Build Windows 10 x64 Installer (.exe / .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      - name: Install dependencies
        run: npm --prefix frontend install

      - name: Build Tauri Windows app
        run: npm --prefix frontend run tauri -- build

      - name: Upload Windows Installers Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photopodra-Windows-x64
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/*.exe
          if-no-files-found: error
