# ==============================================================================
# Cloudflare Tunnel Configuration Example (deploy/cloudflared-config.example.yml)
# ==============================================================================
# Replace <TUNNEL_ID> with the UUID generated by `cloudflared tunnel create photopodra`
# Replace <CREDENTIALS_PATH> with the path to the credentials JSON file
# Replace `photos.yourdomain.com` with your actual domain or subdomain managed on Cloudflare.

tunnel: <TUNNEL_ID>
credentials-file: /root/.cloudflared/<TUNNEL_ID>.json

ingress:
  # Route public HTTPS traffic to the local Photopodra backend (port 3001)
  - hostname: photos.yourdomain.com
    service: http://localhost:3001
    originRequest:
      connectTimeout: 30s
      noTLSVerify: true
      # Disable chunked encoding issues with streaming media if necessary
      disableChunkedEncoding: false

  # Required default catch-all rule: returns 404 for any unmatched traffic
  - service: http_status:404
